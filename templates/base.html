
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LoanRisk AI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">⌂</span>
        <span>LoanRisk AI</span>
      </a>
      <nav class="nav-links">
        <a class="{% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">Home</a>
        <a class="{% if request.endpoint == 'predict' %}active{% endif %}" href="{{ url_for('predict') }}">Predict</a>
        <a class="{% if request.endpoint == 'analysis' %}active{% endif %}" href="{{ url_for('analysis') }}">Analysis</a>
        <a class="{% if request.endpoint == 'about' %}active{% endif %}" href="{{ url_for('about') }}">About</a>
      </nav>
      <div class="nav-actions">
        <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">☼</button>
        <a class="btn btn-primary nav-cta" href="{{ url_for('predict') }}">Get Started</a>
        <button id="mobileMenu" class="menu-btn" aria-label="Open menu">☰</button>
      </div>
    </div>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <strong>LoanRisk AI</strong>
        <span> | IBM BOB Project</span>
      </div>
      <div>Educational machine learning application • © 2026 LoanRisk AI</div>
      <a href="{{ url_for('guide') }}">How to use</a>
    </div>
  </footer>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
